name: Tag on Release Merge

on:
  push:
    branches:
      - main

jobs:
  tag-release:
    name: Mint Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Check if merge was a release commit
        id: check_commit
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          if [[ "$COMMIT_MSG" =~ chore\(release\):\ bump\ version\ to\ ([0-9]+\.[0-9]+\.[0-9]+) ]] || \
             [[ "$COMMIT_MSG" =~ Merge\ pull\ request.*from.*release/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
            echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
            echo "SHOULD_TAG=true" >> $GITHUB_ENV
            echo "Found release tag to create: $TAG"
          else
            echo "SHOULD_TAG=false" >> $GITHUB_ENV
            echo "Not a release commit. Skipping tagging."
          fi

      - name: Configure Git Bot Identity
        if: env.SHOULD_TAG == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and Push Tag
        if: env.SHOULD_TAG == 'true'
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Successfully pushed tag $TAG to origin."
          fi
